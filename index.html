<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Master - Tap to Survive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            background: #0a0e27;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-weight: bold;
            z-index: 11;
            pointer-events: none;
        }

        .score-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 32px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            margin-top: 2px;
        }

        .best-score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-weight: bold;
            z-index: 11;
            text-align: right;
            pointer-events: none;
        }

        .best-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .best-value {
            font-size: 24px;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            margin-top: 2px;
        }

        .difficulty-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 11;
            pointer-events: none;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
            pointer-events: all;
            animation: fadeIn 0.3s ease-out;
            overflow-y: auto;
        }

        .game-over-screen.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-over-title {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4444;
            text-shadow: 0 0 20px #ff4444;
            font-weight: bold;
            animation: scaleIn 0.4s ease-out;
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .final-score {
            font-size: 36px;
            margin-bottom: 10px;
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
        }

        .final-score-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .new-best {
            font-size: 24px;
            color: #ffaa00;
            text-shadow: 0 0 15px #ffaa00;
            margin-bottom: 20px;
            font-weight: bold;
            animation: pulse 0.6s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .restart-btn, .shop-btn {
            margin-top: 15px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
            pointer-events: all;
        }

        .restart-btn:hover, .shop-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
        }

        .restart-btn:active, .shop-btn:active {
            transform: scale(0.95);
        }

        .instruction {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 11;
            pointer-events: none;
            text-align: center;
        }

        .shop-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ffaa00 0%, #ff8800 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
            transition: all 0.3s ease;
        }

        .shop-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.8);
        }

        .shop-coins {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 170, 0, 0.2);
            border: 2px solid #ffaa00;
            border-radius: 20px;
            padding: 8px 16px;
            color: #ffaa00;
            font-weight: bold;
            z-index: 11;
            pointer-events: none;
            font-size: 14px;
        }

        .shop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: all;
        }

        .shop-overlay.show {
            display: flex;
        }

        .shop-panel {
            position: relative;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1229 100%);
            border: 2px solid #667eea;
            border-radius: 20px;
            padding: 30px;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease-out;
            color: #fff;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .shop-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00;
        }

        .shop-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #667eea;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            z-index: 201;
        }

        .shop-close:hover {
            transform: scale(1.1);
        }

        .shop-category {
            margin-bottom: 25px;
        }

        .shop-category-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .shop-items {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .shop-item {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .shop-item:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .shop-item.owned {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .shop-item.owned .owned-badge {
            color: #00ff88;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }

        .shop-item-preview {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .shop-item-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .shop-item-price {
            font-size: 12px;
            color: #ffaa00;
            font-weight: bold;
        }

        .shop-item.owned .shop-item-price {
            color: #00ff88;
        }

        .shop-item.exclusive {
            border-color: #ff4fd8;
            background: linear-gradient(135deg, rgba(255,79,216,.12), rgba(102,126,234,.08));
        }
        .limited-badge {
            display: inline-block;
            margin-bottom: 6px;
            color: #ff4fd8;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .upload-wrap {
            margin-top: 10px;
            padding: 10px;
            border: 1px dashed #667eea;
            border-radius: 10px;
            background: rgba(102,126,234,.08);
        }
        .upload-wrap input {
            width: 100%;
            color: #fff;
            font-size: 11px;
        }
        .ability-ready {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            padding: 10px 16px;
            border: 2px solid #ffaa00;
            border-radius: 24px;
            background: rgba(15,18,41,.92);
            color: #ffaa00;
            font-weight: 900;
            cursor: pointer;
            z-index: 25;
            display: none;
            pointer-events: all;
            box-shadow: 0 0 18px rgba(255,170,0,.35);
        }
        .ability-ready:disabled {
            opacity: .45;
            cursor: not-allowed;
        }
        .ability-toast {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 14px;
            border-radius: 16px;
            background: rgba(0,0,0,.78);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            z-index: 30;
            pointer-events: none;
        }

        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00;
            pointer-events: none;
            opacity: 0;
            animation: levelUpAnim 0.8s ease-out;
            z-index: 20;
        }

        @keyframes levelUpAnim {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(1.5); }
        }

        .purchase-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            color: #000;
            padding: 20px 40px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 300;
            animation: notificationPop 0.6s ease-out;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
        }

        @keyframes notificationPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }


        /* ---------- Admin panel (secret) ---------- */
        .admin-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 400;
            pointer-events: all;
        }

        .admin-panel {

            border-radius: 16px;
            padding: 24px;
            width: 280px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #ff4444;
            text-shadow: 0 0 10px #ff4444;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .admin-btn {
            background: rgba(255,68,68,0.12);
            border: 1px solid #ff4444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .admin-btn:hover { background: rgba(255,68,68,0.25); }
        .admin-btn.active { background: #ff4444; color: #000; }
        .admin-btn.danger { border-color: #ff8800; }
        .admin-btn.danger:hover { background: rgba(255,136,0,0.25); }
        .admin-close {
            margin-top: 6px;
            background: #333;
            border: none;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .score-value { font-size: 28px; }
            .game-over-title { font-size: 36px; }
            .final-score { font-size: 28px; }
            .shop-panel { margin: 20px; max-width: 100%; }
            .shop-items { grid-template-columns: 1fr; }
        }
    </style>
</head>

        // ---------------- Monthly season reset (local) ----------------

        const CURRENT_PERIOD = new Date().toISOString().slice(0, 7); // "YYYY-MM"

        let justRolledOver = false;
        if (lastPeriod && lastPeriod !== CURRENT_PERIOD) {

            const field = CATEGORY_CONFIG[category].field;
            const id = gameState.ballCustomization[field];
            return SHOP_ITEMS[category].find(i => i.id === id) || SHOP_ITEMS[category][0];

        canvas.addEventListener('click', handleCanvasClick);

        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.vx = 0;
                this.vy = 0;
                this.radius = CONFIG.BALL_RADIUS;
                this.isAlive = true;
                this.rotation = 0;
                this.rotationSpeed = 0;
                this.pulsePhase = 0;
            }

            update() {
                if (!this.isAlive) return;

                this.vy += CONFIG.GRAVITY;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.pulsePhase += 0.05;

                this.radius = (gameState.shrinkUntil && Date.now() < gameState.shrinkUntil)
                    ? CONFIG.BALL_RADIUS * 0.5
                    : CONFIG.BALL_RADIUS;

                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -0.8;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -0.8;
                }

                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy = -Math.abs(this.vy) * 0.85;
                }

                if (this.y + this.radius < 0) {
                    this.isAlive = false;
                }

                const isPhased = gameState.phaseUntil && Date.now() < gameState.phaseUntil;
                if (!adminState.godMode && !isPhased) {
                    for (let spike of spikes) {
                        if (this.collidesWith(spike)) {
                            if (gameState.abilityActive && gameState.ballCustomization.ability === 'shield') {
                                gameState.abilityActive = false;
                                spike.vx *= -1;
                                spike.vy *= -1;
                                showAbilityToast('🛡️ Shield blocked the hit!');
                            } else {
                                this.isAlive = false;
                                createExplosion(this.x, this.y);
                                triggerScreenShake();
                            }
                        }
                    }
                }
            }

            collidesWith(spike) {
                const closestX = Math.max(spike.x, Math.min(this.x, spike.x + spike.width));
                const closestY = Math.max(spike.y, Math.min(this.y, spike.y + spike.height));
                const dx = this.x - closestX;
                const dy = this.y - closestY;
                return dx * dx + dy * dy < this.radius * this.radius;
            }

            bounce() {
                const isMega = gameState.abilityActive && gameState.ballCustomization.ability === 'megabounce';
                this.vy = -CONFIG.BOUNCE_STRENGTH * (isMega ? 2 : 1);
                if (isMega) gameState.abilityActive = false;
                gameState.score += (gameState.abilityActive && gameState.ballCustomization.ability === 'double') ? 2 : 1;
                if (gameState.ballCustomization.ability === 'double') gameState.abilityActive = false;
                createBounceEffect(this.x, this.y);
            }

            draw() {
                if (gameState.ballCustomization.effect === 'trail') {
                    ballTrail.push({ x: this.x, y: this.y, age: 0 });
                    if (ballTrail.length > 15) ballTrail.shift();
                    for (let i = 0; i < ballTrail.length; i++) {
                        const point = ballTrail[i];
                        const alpha = 1 - (point.age / 15);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, this.radius * (1 - point.age / 15), 0, Math.PI * 2);
                        ctx.fill();
                        point.age++;
                    }
                }

                const ballColor = getSelectedItem('colors').color;

                if (gameState.customImageData && gameState.customImageUnlocked) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.clip();
                        ctx.drawImage(img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                        ctx.restore();
                    };
                    img.src = gameState.customImageData;
                }

                if (gameState.ballCustomization.effect === 'shadow') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x + 3, this.y + 3, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (!(gameState.customImageData && gameState.customImageUnlocked)) {
                    ctx.fillStyle = ballColor;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (gameState.ballCustomization.pattern === 'glow') {
                    for (let i = 0; i < 3; i++) {
                        ctx.strokeStyle = ballColor + (Math.round((0.5 - i * 0.15) * 255)).toString(16).padStart(2, '0');
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius + i * 8, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                } else if (gameState.ballCustomization.pattern === 'rainbow') {
                    const colors = ['#ff0000', '#ff7700', '#ffff00', '#00ff00', '#0000ff', '#7700ff'];
                    for (let i = 0; i < colors.length; i++) {
                        ctx.fillStyle = colors[i];
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius * (0.6 + (i * 0.05)), 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (gameState.ballCustomization.pattern === 'matrix') {
                    ctx.fillStyle = ballColor;
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2 + this.rotation;
                        const x = this.x + Math.cos(angle) * (this.radius * 0.6);
                        const y = this.y + Math.sin(angle) * (this.radius * 0.6);
                        ctx.fillRect(x - 3, y - 3, 6, 6);
                    }
                } else if (gameState.ballCustomization.pattern === 'liquid') {
                    ctx.fillStyle = ballColor;
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    for (let i = 0; i < 20; i++) {
                        const angle = (i / 20) * Math.PI * 2;
                        const wave = Math.sin(angle * 3 + this.pulsePhase) * 3;
                        const x = this.x + Math.cos(angle) * (this.radius + wave);
                        const y = this.y + Math.sin(angle) * (this.radius + wave);
                        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.globalAlpha = 1;
                } else if (gameState.ballCustomization.pattern === 'fire') {
                    ctx.fillStyle = '#ff3333';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffaa00';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (gameState.ballCustomization.pattern === 'galaxy') {
                    const galaxyGrad = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, this.radius);
                    galaxyGrad.addColorStop(0, '#2a0a4d');
                    galaxyGrad.addColorStop(1, '#0a001a');
                    ctx.fillStyle = galaxyGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < 6; i++) {
                        const ang = (i / 6) * Math.PI * 2 + this.pulsePhase * 0.3;
                        const rr = this.radius * (0.3 + (i % 3) * 0.2);
                        ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#c07bff';
                        ctx.beginPath();
                        ctx.arc(this.x + Math.cos(ang) * rr, this.y + Math.sin(ang) * rr, 1.3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (gameState.ballCustomization.pattern === 'plasma') {
                    const pulse = Math.sin(this.pulsePhase * 2) * 0.5 + 0.5;
                    const plasmaGrad = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, this.radius);
                    plasmaGrad.addColorStop(0, '#ffffff');
                    plasmaGrad.addColorStop(0.4, pulse > 0.5 ? '#ff66ff' : '#66ccff');
                    plasmaGrad.addColorStop(1, '#8800aa');
                    ctx.fillStyle = plasmaGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                } else if (gameState.ballCustomization.pattern === 'checker') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.clip();
                    const cell = this.radius / 2;
                    for (let gx = -2; gx <= 2; gx++) {
                        for (let gy = -2; gy <= 2; gy++) {
                            if ((gx + gy) % 2 === 0) {
                                ctx.fillStyle = '#111';
                                ctx.fillRect(this.x + gx * cell, this.y + gy * cell, cell, cell);
                            }
                        }
                    }
                    ctx.restore();
                } else if (gameState.ballCustomization.pattern === 'stripes') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = '#111';
                    for (let s = -this.radius; s < this.radius; s += 6) {
                        ctx.fillRect(s, -this.radius, 3, this.radius * 2);
                    }
                    ctx.restore();
                } else if (gameState.ballCustomization.pattern === 'nova') {
                    const novaPulse = Math.sin(this.pulsePhase * 2) * 0.5 + 0.5;
                    for (let i = 0; i < 10; i++) {
                        const ang = (i / 10) * Math.PI * 2 + this.pulsePhase;
                        ctx.strokeStyle = `rgba(255, 220, 120, ${0.3 + novaPulse * 0.4})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y);
                        ctx.lineTo(this.x + Math.cos(ang) * (this.radius + 6 + novaPulse * 6), this.y + Math.sin(ang) * (this.radius + 6 + novaPulse * 6));
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#fff8dc';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else if (gameState.ballCustomization.pattern === 'auroraPattern') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.clip();
                    const bandColors = ['#00ffcc', '#66ffcc', '#33ccff', '#9966ff'];
                    for (let i = 0; i < bandColors.length; i++) {
                        ctx.fillStyle = bandColors[i];
                        ctx.globalAlpha = 0.55;
                        ctx.beginPath();
                        const wave = Math.sin(this.pulsePhase + i) * 3;
                        ctx.ellipse(this.x, this.y - this.radius + i * (this.radius / 2) + wave, this.radius, this.radius / 3.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    ctx.restore();
                } else if (gameState.ballCustomization.pattern === 'circuit') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.strokeStyle = '#33ff99';
                    ctx.lineWidth = 1.2;
                    for (let s = -this.radius; s <= this.radius; s += 5) {
                        ctx.beginPath();
                        ctx.moveTo(this.x + s, this.y - this.radius);
                        ctx.lineTo(this.x + s, this.y + this.radius);
                        ctx.stroke();
                    }
                    for (let s = -this.radius; s <= this.radius; s += 5) {
                        ctx.beginPath();
                        ctx.moveTo(this.x - this.radius, this.y + s);
                        ctx.lineTo(this.x + this.radius, this.y + s);
                        ctx.stroke();
                    }
                    ctx.restore();
                } else if (gameState.ballCustomization.pattern === 'polka') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.fillStyle = '#ffffff';
                    for (let gx = -1; gx <= 1; gx++) {
                        for (let gy = -1; gy <= 1; gy++) {
                            ctx.beginPath();
                            ctx.arc(this.x + gx * this.radius * 0.7, this.y + gy * this.radius * 0.7, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    ctx.restore();
                } else if (gameState.ballCustomization.pattern === 'crystal') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    for (let i = 0; i < 6; i++) {
                        const a1 = (i / 6) * Math.PI * 2;
                        const a2 = ((i + 1) / 6) * Math.PI * 2;
                        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.35)' : 'rgba(150,220,255,0.35)';
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(a1) * this.radius, Math.sin(a1) * this.radius);
                        ctx.lineTo(Math.cos(a2) * this.radius, Math.sin(a2) * this.radius);
                        ctx.closePath();
                        ctx.fill();
                    }
                    ctx.restore();
                }

                if (gameState.ballCustomization.effect === 'pulse') {
                    const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                    ctx.strokeStyle = ballColor;
                    ctx.globalAlpha = pulse * 0.5;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + pulse * 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }

                if (gameState.ballCustomization.effect === 'sparkle') {
                    for (let i = 0; i < 4; i++) {
                        const angle = (i / 4) * Math.PI * 2 + this.pulsePhase;
                        const x = this.x + Math.cos(angle) * (this.radius + 15);
                        const y = this.y + Math.sin(angle) * (this.radius + 15);
                        ctx.fillStyle = ballColor;
                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (gameState.ballCustomization.effect === 'comet') {
                    ballTrail.push({ x: this.x, y: this.y, age: 0 });
                    if (ballTrail.length > 18) ballTrail.shift();
                    for (let i = 0; i < ballTrail.length; i++) {
                        const point = ballTrail[i];
                        const alpha = 1 - (point.age / 18);
                        ctx.fillStyle = `rgba(255, 200, 120, ${alpha * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, this.radius * 0.6 * (1 - point.age / 18), 0, Math.PI * 2);
                        ctx.fill();
                        point.age++;
                    }
                }

                if (gameState.ballCustomization.effect === 'aura') {
                    const pulse = Math.sin(this.pulsePhase) * 0.4 + 0.6;
                    for (let i = 0; i < 4; i++) {
                        ctx.strokeStyle = `rgba(180, 100, 255, ${(0.35 - i * 0.07) * pulse})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius + 6 + i * 6 + pulse * 4, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                if (gameState.ballCustomization.effect === 'confetti') {
                    const confettiColors = ['#ff5a5a', '#ffd23f', '#3fd6ff', '#7bff7b', '#ff7bd6'];
                    for (let i = 0; i < 5; i++) {
                        const angle = (i / 5) * Math.PI * 2 + this.pulsePhase * 1.5;
                        const rr = this.radius + 12 + Math.sin(this.pulsePhase * 2 + i) * 4;
                        ctx.save();
                        ctx.translate(this.x + Math.cos(angle) * rr, this.y + Math.sin(angle) * rr);
                        ctx.rotate(angle + this.pulsePhase);
                        ctx.fillStyle = confettiColors[i % confettiColors.length];
                        ctx.fillRect(-2.5, -2.5, 5, 5);
                        ctx.restore();
                    }
                }

                if (gameState.ballCustomization.effect === 'smoke') {
                    ballTrail.push({ x: this.x, y: this.y, age: 0 });
                    if (ballTrail.length > 14) ballTrail.shift();
                    for (let i = 0; i < ballTrail.length; i++) {
                        const point = ballTrail[i];
                        const alpha = 1 - (point.age / 14);
                        ctx.fillStyle = `rgba(150, 150, 160, ${alpha * 0.35})`;
                        ctx.beginPath();
                        ctx.arc(point.x + (Math.random() - 0.5) * 3, point.y, this.radius * 0.8 * (1 - point.age / 14), 0, Math.PI * 2);
                        ctx.fill();
                        point.age++;
                    }
                }

                if (gameState.ballCustomization.effect === 'lightning') {
                    if (Math.random() < 0.35) {
                        ctx.strokeStyle = '#ffffaa';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        let lx = this.x, ly = this.y - this.radius - 4;
                        ctx.moveTo(lx, ly);
                        for (let i = 0; i < 4; i++) {
                            lx += (Math.random() - 0.5) * 12;
                            ly += 6;
                            ctx.lineTo(lx, ly);
                        }
                        ctx.stroke();
                    }
                    ctx.strokeStyle = 'rgba(255,255,150,0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                if (gameState.ballCustomization.effect === 'phoenixflame') {
                    for (let i = 0; i < 6; i++) {
                        const angle = (i / 6) * Math.PI * 2 + this.pulsePhase * 1.2;
                        const rr = this.radius + 4 + Math.sin(this.pulsePhase * 3 + i) * 5;
                        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,90,0,0.6)' : 'rgba(255,200,0,0.6)';
                        ctx.beginPath();
                        ctx.arc(this.x + Math.cos(angle) * rr, this.y + Math.sin(angle) * rr, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (gameState.ballCustomization.effect === 'bubbles') {
                    for (let i = 0; i < 5; i++) {
                        const t = (this.pulsePhase * 20 + i * 17) % 40;
                        const bx = this.x + Math.sin(i * 3 + this.pulsePhase) * (this.radius * 0.8);
                        const by = this.y + this.radius - t;
                        ctx.strokeStyle = 'rgba(150, 220, 255, 0.6)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.arc(bx, by, 2 + (i % 3), 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                if (gameState.ballCustomization.effect === 'stardust') {
                    for (let i = 0; i < 10; i++) {
                        const angle = (i / 10) * Math.PI * 2 + this.pulsePhase * 0.8;
                        const rr = this.radius + 8 + (i % 3) * 4;
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.beginPath();
                        ctx.arc(this.x + Math.cos(angle) * rr, this.y + Math.sin(angle) * rr, 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 5, 5, 0, Math.PI * 2);
                ctx.fill();

                if (gameState.ballCustomization.effect === 'spin') {
                    this.rotationSpeed = 0.1;
                } else {
                    this.rotationSpeed = 0;
                }
            }
        }

        class Spike {
            constructor() {
                this.width = CONFIG.SPIKE_WIDTH;
                this.height = CONFIG.SPIKE_HEIGHT;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = Math.random() * (canvas.height - this.height - 100);
                this.vx = (Math.random() - 0.5) * CONFIG.MAX_SPIKE_SPEED * gameState.speedMultiplier;
                this.vy = (Math.random() - 0.5) * CONFIG.MAX_SPIKE_SPEED * gameState.speedMultiplier;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;

                if (this.x < 0 || this.x + this.width > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y + this.height > canvas.height) this.vy *= -1;

                this.x = Math.max(0, Math.min(this.x, canvas.width - this.width));
                this.y = Math.max(0, Math.min(this.y, canvas.height - this.height));
            }

            draw() {
                const skin = getSelectedItem('spikeColors');

                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);

                const gradient = ctx.createLinearGradient(0, -this.height / 2, 0, this.height / 2);
                gradient.addColorStop(0, skin.colors[0]);
                gradient.addColorStop(0.5, skin.colors[1]);
                gradient.addColorStop(1, skin.colors[2]);
                ctx.fillStyle = gradient;

                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = skin.stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = 1;
                this.size = 4;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life -= 0.02;
                this.size *= 0.98;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function createBounceEffect(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const vx = Math.cos(angle) * 4;
                const vy = Math.sin(angle) * 4;
                const color = getSelectedItem('colors').color;
                particles.push(new Particle(x, y, vx, vy, color));
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                particles.push(new Particle(x, y, vx, vy, '#ff4444'));
            }
        }

        function triggerScreenShake() {
            gameState.shakeIntensity = CONFIG.SCREEN_SHAKE_DURATION;
        }

        function applyScreenShake() {
            if (gameState.shakeIntensity > 0) {
                const intensity = (gameState.shakeIntensity / CONFIG.SCREEN_SHAKE_DURATION) * 5;
                canvas.style.transform = `translate(${Math.random() * intensity - intensity / 2}px, ${Math.random() * intensity - intensity / 2}px)`;
                gameState.shakeIntensity--;
            } else {
                canvas.style.transform = 'translate(0, 0)';
            }
        }

        function initializeShop() {
            // Normal categories
            ['colors','patterns','effects','spikeColors','backgrounds'].forEach(category => {
                const cfg = CATEGORY_CONFIG[category];
                const container = document.getElementById(cfg.containerId);
                container.innerHTML = '';
                SHOP_ITEMS[category].forEach(item => {
                    const isOwned = gameState.ownedItems[category].includes(item.id);
                    const isSelected = gameState.ballCustomization[cfg.field] === item.id;
                    const itemEl = document.createElement('div');
                    itemEl.className = `shop-item ${isOwned ? 'owned' : ''} ${item.exclusive ? 'exclusive' : ''}`;
                    itemEl.style.borderColor = isSelected ? '#00ff88' : (item.exclusive ? '#ff4fd8' : '#667eea');
                    itemEl.innerHTML = `
                        <div class="shop-item-preview">${item.emoji}</div>
                        ${item.limited ? '<div class="limited-badge">★ EXCLUSIVE / LIMITED ★</div>' : ''}
                        <div class="shop-item-name">${item.name}</div>
                        <div class="shop-item-price">
                            ${isOwned ? '<span class="owned-badge">OWNED</span>' : `💰 ${item.cost}`}
                        </div>
                    `;
                    itemEl.addEventListener('click', () => {
                        if (isOwned || item.cost === 0) selectItem(category, item.id);
                        else if (gameState.coins >= item.cost) purchaseItem(category, item.id, item.cost, item.name);
                        else showPurchaseNotification(`Need ${item.cost - Math.floor(gameState.coins)} more coins`);
                    });
                    container.appendChild(itemEl);
                });
            });

            // Custom image purchase/upload item
            const customContainer = document.getElementById('customImageItems');
            customContainer.innerHTML = '';
            const customItem = SHOP_ITEMS.customImage[0];
            const customOwned = gameState.customImageUnlocked;
            const customEl = document.createElement('div');
            customEl.className = `shop-item exclusive ${customOwned ? 'owned' : ''}`;
            customEl.style.borderColor = '#ff4fd8';
            customEl.innerHTML = `
                <div class="shop-item-preview">🖼️</div>
                <div class="limited-badge">★ LIMITED FEATURE ★</div>
                <div class="shop-item-name">${customItem.name}</div>
                <div class="shop-item-price">${customOwned ? '<span class="owned-badge">UNLOCKED</span>' : `💰 ${customItem.cost}`}</div>
                <div class="upload-wrap" ${customOwned ? '' : 'style="opacity:.45;pointer-events:none"'}>
                    <input type="file" id="ballImageUpload" accept="image/png,image/jpeg,image/webp">
                </div>
            `;
            customEl.addEventListener('click', (e) => {
                if (e.target && e.target.id === 'ballImageUpload') return;
                if (!customOwned) {
                    if (gameState.coins >= customItem.cost) {
                        gameState.coins -= customItem.cost;
                        gameState.customImageUnlocked = true;
                        gameState.ownedItems.customImage = ['customImage'];
                        localStorage.setItem('coins', gameState.coins);
                        localStorage.setItem('customImageUnlocked', 'true');
                        localStorage.setItem('ownedItems', JSON.stringify(gameState.ownedItems));
                        document.getElementById('coinsDisplay').textContent = `💰 ${Math.floor(gameState.coins)}`;
                        showPurchaseNotification('Custom Ball Image unlocked!');
                        initializeShop();
                    } else {
                        showPurchaseNotification(`Need ${customItem.cost - Math.floor(gameState.coins)} more coins`);
                    }
                }
            });
            customContainer.appendChild(customEl);

            const upload = document.getElementById('ballImageUpload');
            if (upload) {
                upload.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = () => {
                        gameState.customImageData = reader.result;
                        localStorage.setItem('customImageData', reader.result);
                        gameState.ballCustomization.color = 'green';
                        localStorage.setItem('ballColor', 'green');
                        showPurchaseNotification('Ball image saved!');
                        initializeShop();
                    };
                    reader.readAsDataURL(file);
                });
            }

            // Ability shop
            const abilityContainer = document.getElementById('abilityItems');
            abilityContainer.innerHTML = '';
            SHOP_ITEMS.abilities.forEach(item => {
                const isOwned = gameState.ownedItems.abilities.includes(item.id);
                const equipped = gameState.ballCustomization.ability === item.id;
                const itemEl = document.createElement('div');
                itemEl.className = `shop-item ${isOwned ? 'owned' : ''}`;
                itemEl.style.borderColor = equipped ? '#00ff88' : '#667eea';
                itemEl.innerHTML = `
                    <div class="shop-item-preview">${item.emoji}</div>
                    <div class="shop-item-name">${item.name}</div>
                    <div style="font-size:10px;color:#aaa;margin-bottom:7px">${item.description}</div>
                    <div class="shop-item-price">${isOwned ? '<span class="owned-badge">EQUIPPED/OWNED</span>' : `💰 ${item.cost}`}</div>
                `;
                itemEl.addEventListener('click', () => {
                    if (isOwned) {
                        gameState.ballCustomization.ability = item.id;
                        localStorage.setItem('equippedAbility', item.id);
                        updateAbilityButton();
                        initializeShop();
                    } else if (gameState.coins >= item.cost) {
                        gameState.coins -= item.cost;
                        gameState.ownedItems.abilities.push(item.id);
                        gameState.ballCustomization.ability = item.id;
                        localStorage.setItem('coins', gameState.coins);
                        localStorage.setItem('ownedItems', JSON.stringify(gameState.ownedItems));
                        localStorage.setItem('equippedAbility', item.id);
                        document.getElementById('coinsDisplay').textContent = `💰 ${Math.floor(gameState.coins)}`;
                        showPurchaseNotification(`${item.name} purchased!`);
                        updateAbilityButton();
                        initializeShop();
                    } else {
                        showPurchaseNotification(`Need ${item.cost - Math.floor(gameState.coins)} more coins`);
                    }
                });
                abilityContainer.appendChild(itemEl);
            });
        }

        function selectItem(category, itemId) {
            const cfg = CATEGORY_CONFIG[category];
            gameState.ballCustomization[cfg.field] = itemId;
            localStorage.setItem(cfg.storageKey, itemId);
            initializeShop();
        }

        function purchaseItem(category, itemId, cost, itemName) {
            gameState.coins -= cost;
            localStorage.setItem('coins', gameState.coins);

            if (!gameState.ownedItems[category].includes(itemId)) {
                gameState.ownedItems[category].push(itemId);
            }
            localStorage.setItem('ownedItems', JSON.stringify(gameState.ownedItems));

            document.getElementById('coinsDisplay').textContent = `💰 ${Math.floor(gameState.coins)}`;

            selectItem(category, itemId);
            showPurchaseNotification(`Purchased ${itemName}!`);
        }

        function updateAbilityButton() {
            const btn = document.getElementById('abilityButton');
            const id = gameState.ballCustomization.ability;
            const item = SHOP_ITEMS.abilities.find(a => a.id === id);
            if (!item || !gameState.ownedItems.abilities.includes(id)) {
                btn.style.display = 'none';
                return;
            }
            btn.textContent = `${item.emoji} ${item.name} — ${gameState.abilityUsed ? 'USED' : 'USE'}`;
            btn.style.display = gameState.isRunning ? 'block' : 'none';
            btn.disabled = gameState.abilityUsed;
        }

        function useAbility() {
            if (!gameState.isRunning || gameState.abilityUsed) return;
            const id = gameState.ballCustomization.ability;
            if (!gameState.ownedItems.abilities.includes(id)) return;
            gameState.abilityUsed = true;

            if (id === 'shield') {
                gameState.abilityActive = true;
                showAbilityToast('🛡️ Shield active — blocks the next hit');
            } else if (id === 'slow') {
                for (const spike of spikes) {
                    spike.vx *= 0.45;
                    spike.vy *= 0.45;
                }
                setTimeout(() => {
                    if (gameState.isRunning) {
                        for (const spike of spikes) {
                            spike.vx *= 1 / 0.45;
                            spike.vy *= 1 / 0.45;
                        }
                    }
                }, 5000);
                showAbilityToast('🐌 Spikes slowed for 5 seconds');
            } else if (id === 'double') {
                gameState.abilityActive = true;
                showAbilityToast('⬆️ Next bounce gives +2 score');
            } else if (id === 'magnet') {
                gameState.abilityBonus = 50;
                showAbilityToast('🧲 +50 bonus coins at the end of this match');
            } else if (id === 'phase') {
                gameState.phaseUntil = Date.now() + 2000;
                showAbilityToast('👻 Phased through spikes for 2 seconds');
            } else if (id === 'freeze') {
                for (const spike of spikes) {
                    spike._frozenVx = spike.vx;
                    spike._frozenVy = spike.vy;
                    spike.vx = 0;
                    spike.vy = 0;
                }
                setTimeout(() => {
                    for (const spike of spikes) {
                        if (spike._frozenVx !== undefined) {
                            spike.vx = spike._frozenVx;
                            spike.vy = spike._frozenVy;
                        }
                    }
                }, 4000);
                showAbilityToast('🧊 Spikes frozen for 4 seconds');
            } else if (id === 'megabounce') {
                gameState.abilityActive = true;
                showAbilityToast('🚀 Next bounce launches twice as high');
            } else if (id === 'goldenrush') {
                gameState.goldenRushActive = true;
                showAbilityToast('💰 Coins doubled for this match');
            } else if (id === 'vortex') {
                for (const spike of spikes) {
                    const edge = Math.floor(Math.random() * 4);
                    if (edge === 0) { spike.x = 0; spike.y = Math.random() * canvas.height; }
                    else if (edge === 1) { spike.x = canvas.width - spike.width; spike.y = Math.random() * canvas.height; }
                    else if (edge === 2) { spike.x = Math.random() * canvas.width; spike.y = 0; }
                    else { spike.x = Math.random() * canvas.width; spike.y = canvas.height - spike.height; }
                }
                showAbilityToast('🌪️ Spikes scattered to the edges');
            } else if (id === 'shrink') {
                gameState.shrinkUntil = Date.now() + 5000;
                showAbilityToast('🔬 Mini ball for 5 seconds');
            }
            updateAbilityButton();
        }

        function showAbilityToast(text) {
            const old = document.querySelector('.ability-toast');
            if (old) old.remove();
            const el = document.createElement('div');
            el.className = 'ability-toast';
            el.textContent = text;
            document.querySelector('.ui-overlay').appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }

        const ADMIN_PASSCODE = "changeme123";

            const unlocked = isLocalFile || localStorage.getItem('adminUnlocked') === 'true';

            if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
                secretBuffer = (secretBuffer + e.key.toLowerCase()).slice(-5);
                if (secretBuffer === 'admin') {
                    secretBuffer = '';
                    toggleAdminPanel();
                }
            }
        });

            gameState.customImageUnlocked = true;
            localStorage.setItem('ownedItems', JSON.stringify(gameState.ownedItems));
            localStorage.setItem('customImageUnlocked', 'true');
            initializeShop();
            showPurchaseNotification('All items unlocked!');
        });
        document.getElementById('adminGod').addEventListener('click', (e) => {
            adminState.godMode = !adminState.godMode;
            e.target.textContent = `God Mode: ${adminState.godMode ? 'ON' : 'OFF'}`;
            e.target.classList.toggle('active', adminState.godMode);
        });
        document.getElementById('adminNewMonth').addEventListener('click', () => {
            localStorage.removeItem('lastPeriod');
            gameState.bestScore = 0;
            gameState.coins = 0;
            localStorage.setItem('bestScore', '0');
            localStorage.setItem('coins', '0');
            document.getElementById('bestScore').textContent = 0;
            document.getElementById('coinsDisplay').textContent = '💰 0';
            showPurchaseNotification('Simulated a new month — reload the page to confirm the reset.');
        });
        document.getElementById('adminReset').addEventListener('click', () => {
            if (confirm('Reset ALL local progress? This clears coins, best score, and unlocks.')) {
                localStorage.clear();
                location.reload();
            }
        });

        function startGame() {
            gameState.isRunning = true;
            gameState.score = 0;
            gameState.elapsedTime = 0;
            gameState.level = 1;
            gameState.speedMultiplier = 1;
            gameState.abilityUsed = false;
            gameState.abilityActive = false;
            gameState.abilityBonus = 0;
            gameState.goldenRushActive = false;
            gameState.phaseUntil = 0;
            gameState.shrinkUntil = 0;
            gameStartTime = Date.now();

            ball = new Ball();
            spikes = [];
            particles = [];
            ballTrail = [];

            for (let i = 0; i < 3; i++) {
                spikes.push(new Spike());
            }

            document.getElementById('gameOverScreen').classList.remove('show');
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('shopButton').style.display = 'none';
            document.getElementById('coinsDisplay').style.display = 'none';
            updateAbilityButton();
            loop();
        }

        function endGame() {
            gameState.isRunning = false;
            document.getElementById('instruction').style.display = 'block';
            document.getElementById('shopButton').style.display = 'flex';
            document.getElementById('coinsDisplay').style.display = 'block';

            const baseCoins = Math.floor(gameState.score * CONFIG.COINS_PER_POINT) + gameState.abilityBonus;
            const earnedCoins = gameState.goldenRushActive ? baseCoins * 2 : baseCoins;
            gameState.coins += earnedCoins;
            gameState.abilityBonus = 0;
            gameState.goldenRushActive = false;
            localStorage.setItem('coins', gameState.coins);
            document.getElementById('coinsDisplay').textContent = `💰 ${Math.floor(gameState.coins)}`;

            const isNewBest = gameState.score > gameState.bestScore;
            if (isNewBest) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('bestScore', gameState.bestScore);
                document.getElementById('bestScore').textContent = gameState.bestScore;
            }

            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('earnedCoins').textContent = `+💰 ${earnedCoins}`;
            document.getElementById('earnedCoins').style.display = 'block';
            document.getElementById('newBest').style.display = isNewBest ? 'block' : 'none';
            document.getElementById('gameOverScreen').classList.add('show');
            updateAbilityButton();
        }

        function handleCanvasClick(e) {
            e.preventDefault();
            if (!gameState.isRunning) {
                startGame();
            } else if (ball && ball.isAlive) {
                ball.bounce();
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = gameState.score;

            const level = Math.floor(gameState.elapsedTime / CONFIG.DIFFICULTY_INTERVAL) + 1;
            if (level !== gameState.level) {
                gameState.level = level;
                gameState.speedMultiplier = 1 + (level - 1) * 0.15;

                const levelUpEl = document.createElement('div');
                levelUpEl.className = 'level-up';
                levelUpEl.textContent = `LEVEL ${level}!`;
                document.querySelector('.ui-overlay').appendChild(levelUpEl);

                setTimeout(() => levelUpEl.remove(), 800);

                if (spikes.length < 3 + Math.floor((level - 1) / 2)) {
                    spikes.push(new Spike());
                }
            }

            document.getElementById('difficulty').textContent = `Level ${gameState.level} (${Math.floor((gameState.elapsedTime % CONFIG.DIFFICULTY_INTERVAL) / 100)}%)`;
        }

        function loop() {
            if (!gameState.isRunning) return;

            const bg = getSelectedItem('backgrounds');
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, bg.top);
            bgGradient.addColorStop(1, bg.bottom);
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = bg.grid;
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            gameState.elapsedTime = Date.now() - gameStartTime;

            if (ball) {
                ball.update();
                ball.draw();
            }

            for (let spike of spikes) {
                spike.update();
                spike.draw();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            applyScreenShake();
            updateUI();

            if (!ball || !ball.isAlive) {
                endGame();
                return;
            }

            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        });


        updateUI();
        updateAbilityButton();
        if (justRolledOver) {
            setTimeout(() => showPurchaseNotification('🗓️ New month — score & coins reset!'), 400);
        }
        loop();
    </script>
</body>
</html>
