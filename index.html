<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Master - Tap to Survive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            background: #0a0e27;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-weight: bold;
            z-index: 11;
            pointer-events: none;
        }

        .score-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 32px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            margin-top: 2px;
        }

        .best-score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-weight: bold;
            z-index: 11;
            text-align: right;
            pointer-events: none;
        }

        .best-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .best-value {
            font-size: 24px;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            margin-top: 2px;
        }

        .difficulty-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 11;
            pointer-events: none;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
            pointer-events: all;
            animation: fadeIn 0.3s ease-out;
        }

        .game-over-screen.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .game-over-title {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4444;
            text-shadow: 0 0 20px #ff4444;
            font-weight: bold;
            animation: scaleIn 0.4s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final-score {
            font-size: 36px;
            margin-bottom: 10px;
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
        }

        .final-score-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .new-best {
            font-size: 24px;
            color: #ffaa00;
            text-shadow: 0 0 15px #ffaa00;
            margin-bottom: 20px;
            font-weight: bold;
            animation: pulse 0.6s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .restart-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
            pointer-events: all;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        .instruction {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 11;
            pointer-events: none;
            text-align: center;
        }

        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00;
            pointer-events: none;
            opacity: 0;
            animation: levelUpAnim 0.8s ease-out;
            z-index: 20;
        }

        @keyframes levelUpAnim {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -100%) scale(1.5);
            }
        }

        @media (max-width: 600px) {
            .score-value {
                font-size: 28px;
            }

            .game-over-title {
                font-size: 36px;
            }

            .final-score {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-overlay">
            <div class="score-container">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="best-score">
                <div class="best-label">Best</div>
                <div class="best-value" id="bestScore">0</div>
            </div>
            <div class="difficulty-indicator" id="difficulty">Level 1</div>
            <div class="instruction" id="instruction">TAP TO START</div>
        </div>

        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-title">GAME OVER</div>
            <div class="final-score-label">Final Score</div>
            <div class="final-score" id="finalScore">0</div>
            <div class="new-best" id="newBest" style="display: none;">🎉 NEW BEST!</div>
            <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const CONFIG = {
            BALL_RADIUS: 15,
            SPIKE_WIDTH: 20,
            SPIKE_HEIGHT: 40,
            GRAVITY: 0.6,
            BOUNCE_STRENGTH: 12,
            MAX_SPIKE_SPEED: 8,
            PARTICLE_COUNT: 20,
            DIFFICULTY_INTERVAL: 10000,
            SCREEN_SHAKE_DURATION: 150,
        };

        // Game State
        let gameState = {
            isRunning: false,
            isPaused: false,
            score: 0,
            bestScore: localStorage.getItem('bestScore') || 0,
            elapsedTime: 0,
            shakeIntensity: 0,
            level: 1,
            speedMultiplier: 1,
        };

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        // Game objects
        let ball = null;
        let spikes = [];
        let particles = [];
        let gameStartTime = 0;

        // Initialize
        document.getElementById('bestScore').textContent = gameState.bestScore;
        document.getElementById('restartBtn').addEventListener('click', startGame);
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', handleCanvasClick);

        // Ball class
        class Ball {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.vx = 0;
                this.vy = 0;
                this.radius = CONFIG.BALL_RADIUS;
                this.isAlive = true;
            }

            update() {
                if (!this.isAlive) return;

                this.vy += CONFIG.GRAVITY;
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -0.8;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -0.8;
                }

                // Bounce off bottom
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy = -Math.abs(this.vy) * 0.85;
                }

                // Death if ball falls off top
                if (this.y + this.radius < 0) {
                    this.isAlive = false;
                }

                // Check collision with spikes
                for (let spike of spikes) {
                    if (this.collidesWith(spike)) {
                        this.isAlive = false;
                        createExplosion(this.x, this.y);
                        triggerScreenShake();
                    }
                }
            }

            collidesWith(spike) {
                const closestX = Math.max(spike.x, Math.min(this.x, spike.x + spike.width));
                const closestY = Math.max(spike.y, Math.min(this.y, spike.y + spike.height));
                const dx = this.x - closestX;
                const dy = this.y - closestY;
                return dx * dx + dy * dy < this.radius * this.radius;
            }

            bounce() {
                this.vy = -CONFIG.BOUNCE_STRENGTH;
                gameState.score++;
                createBounceEffect(this.x, this.y);
            }

            draw() {
                // Glow effect
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, 'rgba(0, 255, 136, 0.8)');
                gradient.addColorStop(1, 'rgba(0, 255, 136, 0.2)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
                ctx.fill();

                // Ball
                ctx.fillStyle = '#00ff88';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 5, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Spike class
        class Spike {
            constructor() {
                this.width = CONFIG.SPIKE_WIDTH;
                this.height = CONFIG.SPIKE_HEIGHT;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = Math.random() * (canvas.height - this.height - 100);
                this.vx = (Math.random() - 0.5) * CONFIG.MAX_SPIKE_SPEED * gameState.speedMultiplier;
                this.vy = (Math.random() - 0.5) * CONFIG.MAX_SPIKE_SPEED * gameState.speedMultiplier;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;

                // Bounce off walls
                if (this.x < 0 || this.x + this.width > canvas.width) {
                    this.vx *= -1;
                }
                if (this.y < 0 || this.y + this.height > canvas.height) {
                    this.vy *= -1;
                }

                // Keep in bounds
                this.x = Math.max(0, Math.min(this.x, canvas.width - this.width));
                this.y = Math.max(0, Math.min(this.y, canvas.height - this.height));
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);

                // Spike gradient
                const gradient = ctx.createLinearGradient(0, -this.height / 2, 0, this.height / 2);
                gradient.addColorStop(0, '#ff4444');
                gradient.addColorStop(0.5, '#ff2222');
                gradient.addColorStop(1, '#cc0000');
                ctx.fillStyle = gradient;

                // Draw spike shape
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();

                // Outline
                ctx.strokeStyle = '#ff7777';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }
        }

        // Particle class
        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = 1;
                this.size = 4;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life -= 0.02;
                this.size *= 0.98;
            }

            draw() {
                ctx.fillStyle = this.color.replace(')', `, ${this.life})`).replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Effects
        function createBounceEffect(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const vx = Math.cos(angle) * 4;
                const vy = Math.sin(angle) * 4;
                particles.push(new Particle(x, y, vx, vy, 'rgb(0, 255, 136)'));
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                particles.push(new Particle(x, y, vx, vy, 'rgb(255, 68, 68)'));
            }
        }

        function triggerScreenShake() {
            gameState.shakeIntensity = CONFIG.SCREEN_SHAKE_DURATION;
        }

        function applyScreenShake() {
            if (gameState.shakeIntensity > 0) {
                const intensity = (gameState.shakeIntensity / CONFIG.SCREEN_SHAKE_DURATION) * 5;
                canvas.style.transform = `translate(${Math.random() * intensity - intensity / 2}px, ${Math.random() * intensity - intensity / 2}px)`;
                gameState.shakeIntensity--;
            } else {
                canvas.style.transform = 'translate(0, 0)';
            }
        }

        // Game functions
        function startGame() {
            gameState.isRunning = true;
            gameState.score = 0;
            gameState.elapsedTime = 0;
            gameState.level = 1;
            gameState.speedMultiplier = 1;
            gameStartTime = Date.now();

            ball = new Ball();
            spikes = [];
            particles = [];

            // Create initial spikes
            for (let i = 0; i < 3; i++) {
                spikes.push(new Spike());
            }

            document.getElementById('gameOverScreen').classList.remove('show');
            document.getElementById('instruction').style.display = 'none';
            loop();
        }

        function endGame() {
            gameState.isRunning = false;
            document.getElementById('instruction').style.display = 'block';

            const isNewBest = gameState.score > gameState.bestScore;
            if (isNewBest) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('bestScore', gameState.bestScore);
                document.getElementById('bestScore').textContent = gameState.bestScore;
            }

            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('newBest').style.display = isNewBest ? 'block' : 'none';
            document.getElementById('gameOverScreen').classList.add('show');
        }

        function handleCanvasClick(e) {
            e.preventDefault();
            if (!gameState.isRunning) {
                startGame();
            } else if (ball.isAlive) {
                ball.bounce();
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            
            const level = Math.floor(gameState.elapsedTime / CONFIG.DIFFICULTY_INTERVAL) + 1;
            if (level !== gameState.level) {
                gameState.level = level;
                gameState.speedMultiplier = 1 + (level - 1) * 0.15;

                // Create level up animation
                const levelUpEl = document.createElement('div');
                levelUpEl.className = 'level-up';
                levelUpEl.textContent = `LEVEL ${level}!`;
                const overlay = document.querySelector('.ui-overlay');
                overlay.appendChild(levelUpEl);

                setTimeout(() => levelUpEl.remove(), 800);

                // Increase number of spikes
                if (spikes.length < 3 + Math.floor((level - 1) / 2)) {
                    spikes.push(new Spike());
                }
            }

            document.getElementById('difficulty').textContent = `Level ${gameState.level} (${Math.floor((gameState.elapsedTime % CONFIG.DIFFICULTY_INTERVAL) / 100)}%)`;
        }

        function loop() {
            if (!gameState.isRunning) return;

            // Clear canvas
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid background
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Update game time
            gameState.elapsedTime = Date.now() - gameStartTime;

            // Update and draw
            ball.update();
            ball.draw();

            for (let spike of spikes) {
                spike.update();
                spike.draw();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            applyScreenShake();
            updateUI();

            if (!ball.isAlive) {
                endGame();
                return;
            }

            requestAnimationFrame(loop);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        });

        // Initialize
        updateUI();
        loop();
    </script>
</body>
</html>
